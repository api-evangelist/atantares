name: atantares
description: >-
  Atantares (芯宿科技) is a Chinese synthetic-biology company based in Suzhou
  Industrial Park that builds "silicon-based biology" — semiconductor-driven
  biotechnology. Its chip-based, high-throughput platform (the EcoSyn synthesizer
  and ECHOS MicroArray, using electrochemical oligonucleotide synthesis on
  CMOS/MEMS microelectrode arrays) drives low-cost, high-fidelity DNA synthesis
  and is expanding into RNA and protein synthesis and detection. Research-service
  offerings include primer/oligo synthesis, gene synthesis, gene sequencing,
  cloning and mutagenesis, strain-library preparation, and gene editing, built on
  an in-house full-workflow automation, sequence-analysis, and order-management
  platform. Backed by Qiming Venture Partners. The company operates a marketing
  website only and publishes no public developer program, API, or documentation
  at the time of this profile.
